# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    # 1. Define the matrix to run on all three operating systems
    strategy:
      matrix:
        # os: [windows-latest, ubuntu-latest, macos-latest]
        os: [windows-latest]
      # Set to false so if one OS build fails, the others will still continue
      fail-fast: false

    # 2. Tell the job to use the current OS in the matrix
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Forces downloading all history and tags

    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"

    # 3. Handle Linux-specific system dependencies for UI/Audio
#    - name: Install Linux UI/Audio Dependencies
#      if: runner.os == 'Linux'
#      run: |
#        sudo apt-get update
#        sudo apt-get install -y libasound2-dev libgl1-mesa-glx libxcb-cursor0 libxcb-xinerama0

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

#    - name: Test with pytest
#      run: |
#        pytest

    - name: Build
      run: |
        python build.py

    - name: Read Version from Python
      id: get_version
      shell: bash # Use bash to avoid PowerShell quote-escaping issues on Windows
      run: |
        python -c "
        import os
        
        # Read the version file safely
        version_globals = {}
        with open('src/_version.py', 'r', encoding='utf-8') as f:
            exec(f.read(), version_globals)
        version = version_globals.get('__version__', 'VERSION_UNKNOWN')
        
        # Append the dynamic name directly to the GitHub outputs file
        with open(os.environ['GITHUB_OUTPUT'], 'a') as env_file:
            env_file.write(f'ARTIFACT_NAME=VoiceVis-{version}\n')
        "

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        # 4. Inject the OS name dynamically so artifacts don't overwrite each other
        name: ${{ steps.get_version.outputs.ARTIFACT_NAME }}-${{ runner.os }}
        # PyInstaller outputs the folder to dist/<name> in onedir mode
        path: dist/VoiceVis-*/
        retention-days: 3